# Configuración CANÓNICA de escenarios ("de fábrica").
#
# La app la restaura sobre escenario.yaml al ARRANCAR cada sesión: los cambios
# de origen/destino hechos en la interfaz y los escenarios creados durante una
# sesión NO se conservan al volver a abrir la app.
#
# Para cambiar los valores por defecto de A y B (o añadir un escenario
# permanente), edita ESTE fichero — no escenario.yaml, que es efímero.
crs_trabajo: EPSG:25830
resolucion_m: 30
escenario_A:
  origen:
    nombre: A_inicial
    x: 741453
    y: 4561984
  destino:
    nombre: A_final
    x: 739098
    y: 4550264
escenario_B:
  origen:
    nombre: B_inicial
    x: 692198
    y: 4596017
  destino:
    nombre: B_final
    x: 693832
    y: 4600576
