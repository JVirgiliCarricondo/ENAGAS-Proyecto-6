# Caso de estudio — Grupo 6 (Reto 6, Enagás)
# Define el CRS y la rejilla de trabajo, el área de interés (AOI) y los pares origen→destino.
# Hay dos escenarios independientes (A y B). El pipeline ejecuta uno a la vez.
# El escenario activo se selecciona en src/app/ o por parámetro de línea de comandos.

crs_trabajo: "EPSG:25830"     # ETRS89 / UTM 30N (península). CRS común de todas las capas.
resolucion_m: 30              # tamaño de celda de la rejilla común, en metros

# ─── ESCENARIO A ────────────────────────────────────────────────────────────
escenario_A:

  # AOI: buffer de 1 km a cada lado de la línea A_inicial→A_final
  aoi:
    xmin: 738118
    ymin: 4550067
    xmax: 742433
    ymax: 4562181

  origen:
    nombre: "A_inicial"
    x: 741453
    y: 4561984

  destino:
    nombre: "A_final"
    x: 739098
    y: 4550264

# ─── ESCENARIO B ────────────────────────────────────────────────────────────
escenario_B:

  # AOI: buffer de 1 km a cada lado de la línea B_inicial→B_final
  aoi:
    xmin: 691257
    ymin: 4595680
    xmax: 694773
    ymax: 4600913

  origen:
    nombre: "B_inicial"
    x: 692198
    y: 4596017

  destino:
    nombre: "B_final"
    x: 693832
    y: 4600576
