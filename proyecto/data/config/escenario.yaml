# Caso de estudio — Grupo 6 (Reto 6, Enagás)
# Define el CRS y la rejilla de trabajo, el área de interés (AOI) y el par origen→destino.

crs_trabajo: "EPSG:25830"     # ETRS89 / UTM 30N (península). CRS común de todas las capas.
resolucion_m: 30               # tamaño de celda de la rejilla común, en metros

# Área de interés: bounding box en crs_trabajo (metros)
# Buffer de 1 km a cada lado de la línea recta origen→destino (ancho total: 2 km)
aoi:
  xmin: 407725
  ymin: 4281818
  xmax: 411668
  ymax: 4295981
  # opción B — polígono: descomentar y apuntar a un fichero en esta carpeta
  # geojson: "aoi.geojson"

# Origen: planta de H₂ (coordenadas en EPSG:25830, metros)
origen:
  nombre: "Planta H2 Puertollano"
  x: 410678
  y: 4295841

# Destino: conexión a la red troncal (coordenadas en EPSG:25830, metros)
destino:
  nombre: "Conexion red troncal"
  x: 408716
  y: 4281958
