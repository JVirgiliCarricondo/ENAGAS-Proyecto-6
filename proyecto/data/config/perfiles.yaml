# Perfiles de prioridad — Grupo 6 (Reto 6, Enagás)
# Cada perfil es un vector de PESOS (adimensionales) sobre las capas de coste.
# Pesos distintos -> superficies de coste distintas -> rutas DIFERENCIADAS.
# Estos valores son orientativos: calibrarlos con el caso real (ver seguimiento.md).
#
# NORMALIZACIÓN: los pesos de cada perfil están normalizados para sumar 1.00
# (100%). Como consecuencia, cada peso individual queda siempre en [0, 1],
# igual que los valores intra-capa de parametros_capas (ver más abajo). Si se
# recalibra un perfil, volver a dividir cada peso por la suma del vector.

# ============================================================================
# PERFILES DE PRIORIDAD (4 alternativas diferenciadas)
# ============================================================================

perfiles:
  - id: corto
    nombre: "Más corto"
    descripcion: "Minimiza la longitud; tolera más pendiente e impacto ambiental."
    # Normalizado (suma=1.00): proporciones originales / 2.6.
    pesos:
      longitud:     0.5769   # distancia muy importante
      pendiente:    0.0769
      protegida:    0.0769
      cruces:       0.1154
      expropiacion: 0.0769
      geotecnia:    0.0385
      traversal:    0.0385  # poca importancia: solo interesa la longitud
    nota: "Mejor velocidad de ejecución, pero pendientes/impacto mayores"

  - id: ambiental
    nombre: "Menor impacto ambiental"
    descripcion: "Evita zonas protegidas (Red Natura 2000) y cruces; aunque alargue el trazado."
    # Normalizado (suma=1.00): proporciones originales / 4.0.
    pesos:
      protegida:    0.375   # evitar zonas protegidas ante todo
      cruces:       0.200   # evitar cruces con infraestructuras
      expropiacion: 0.125
      pendiente:    0.075
      geotecnia:    0.075
      longitud:     0.075
      traversal:    0.075
    nota: "Prioriza viabilidad medioambiental"

  - id: pendiente
    nombre: "Menor pendiente y traversalidad"
    descripcion: "Busca terreno llano y sigue la dirección del gradiente (mayor estabilidad geotécnica)."
    # Normalizado (suma=1.00): proporciones originales / 4.8.
    pesos:
      pendiente:    0.3125   # evitar pendiente fuerte
      traversal:    0.2500   # seguir la dirección del gradiente
      geotecnia:    0.1667   # terreno estable
      protegida:    0.0833
      cruces:       0.0625
      expropiacion: 0.0625
      longitud:     0.0625
    nota: "Reduce coste de obra por excavación y riesgo de movimientos de ladera"

  - id: equilibrio
    nombre: "Equilibrio (recomendado)"
    descripcion: "Balance multicriterio calibrado con las bandas de ponderación de Enagás (anexo II, EV-500)."
    # Pesos alineados con la tabla de Enagás (suman 1.00 = 100 %).
    # Mapeo capa→grupo; el grupo Patrimonio (sin capa en el modelo) se redistribuye
    # entre los 4 grupos con capa, reescalando sus puntos medios dentro de banda:
    #   Medioambiente 30-40 %  → protegida                       0.37
    #   Urbanístico   15-25 %  → expropiacion                    0.21
    #   Geotecnia     15-25 %  → geotecnia+pendiente+traversal   0.21
    #   Construcción  10-20 %  → cruces                          0.16
    #   Otros          5 %     → longitud                        0.05
    pesos:
      protegida:    0.37   # Medioambiente
      expropiacion: 0.21   # Urbanístico
      geotecnia:    0.09   # Geotecnia ┐
      pendiente:    0.08   # Geotecnia ├ 0.21
      traversal:    0.04   # Geotecnia ┘
      cruces:       0.16   # Construcción / cruces
      longitud:     0.05   # Otros (coste-distancia base del LCP)
    nota: "Pesos alineados con anexo II EV-500 (Enagás); Patrimonio (sin capa) redistribuido."

# ============================================================================
# PARÁMETROS DE COSTE INTRA-CAPA (calibrables)
# Todos los valores numéricos de cada capa de coste se definen aquí.
# Los módulos Python leen este bloque al importarse; editar el YAML y
# volver a ejecutar el pipeline es suficiente para recalibrar cualquier peso.
#
# ESTANDARIZACIÓN (metodología oficial Enagás — docs/metodologia_enagas.md):
#   Las capas con condicionante en la tabla oficial (geotecnia, expropiación,
#   zonas protegidas y cruces) tienen sus costes derivados de los factores de
#   ponderación (A) oficiales con un divisor común:
#
#       coste_celda = A_oficial / A_REF      con A_REF = 38
#
#   38 = "Terrenos inestables (arcillas expansivas)", el mayor factor entre los
#   condicionantes que modelamos. Así TODA capa queda en [0, 1] (estandarizada)
#   y se conserva la jerarquía oficial ENTRE condicionantes, requisito para que
#   la suma ponderada de capas produzca soluciones comparables.
#   Anclajes: RedNatura 28.5→0.75 · urbano 25.25→0.66 · urbano medio/industrial
#   17.75→0.47 · roca dura 13→0.34 · curso hídrico permanente 13→0.34 · curso
#   hídrico no permanente 9.75→0.26 · yeso/inestable 38→1.00.
#   Clases SIN factor oficial (litologías intermedias, viario/ferrocarril) se
#   interpolan por dificultad constructiva dentro del mismo [0, 1].
#   La capa de PENDIENTE queda fuera de este criterio (se mantiene intacta).
# ============================================================================

parametros_capas:

  # --------------------------------------------------------------------------
  # P1 — Pendiente (src/superficie/pendiente.py)
  # Curva de coste por tramos sobre la pendiente en grados (algoritmo Horn).
  #   [0, umbral_llano_deg]               → coste 0.0  (terreno trivial)
  #   [umbral_llano_deg, umbral_inclinado_deg] → rampa lineal 0.0 → coste_max_inclinado
  #   [umbral_inclinado_deg, umbral_barrera_deg] → rampa lineal coste_max_inclinado → 1.0
  #   > umbral_barrera_deg                → np.inf (celda intransitable)
  # --------------------------------------------------------------------------
  pendiente:
    umbral_llano_deg: 5          # por debajo: coste 0.0
    umbral_inclinado_deg: 15     # inicio de segunda rampa
    coste_max_inclinado: 0.6     # coste al llegar a umbral_inclinado_deg
    umbral_barrera_deg: 30       # por encima: barrera dura (np.inf)

  # --------------------------------------------------------------------------
  # P2 — Geotecnia (src/superficie/geotecnia.py)
  # Índice de coste geotécnico por litología (campo DLO del IGME).
  # Cualquier DLO no listado recibe default_cost.
  # Valores [0.05, 1.0] estandarizados (A_oficial / 38). Anclajes oficiales:
  #   · Caliza presente = "Roca dura" (A=13)            → 0.34
  #   · Yeso/expansivo  = "Terrenos inestables" (A=38)  → 1.00
  # Las clases intermedias (sin factor oficial) se interpolan por dificultad de
  # excavación; el terreno trivial (aluviales) ≈ 0 (no es condicionante).
  # Nota: las dos entradas marcadas "corrupción GPKG" son variantes del mismo
  # DLO con caracteres mal codificados en la fuente; no modificarlas.
  # --------------------------------------------------------------------------
  geotecnia:
    default_cost: 0.15
    tabla_costes:
      # ── Coste 0.05: Aluviales y fondos de valle (excavación trivial) ───────
      "Gravas, arenas, limos y arcillas. Aluviales y fondos de valle": 0.05
      "CANTOS, ARENAS Y LIMOS. CONOS DE DEYECCIÓN": 0.05
      "Cantos y gravas polimácticas redondeadas. Terrazas": 0.05
      "Cantos y gravas polimícticas redondeadas. Terrazas": 0.05    # corrupción GPKG: á→í
      "GRAVAS POLIGENICAS, ARENAS Y LIMOS. TERRAZAS": 0.05
      # ── Coste 0.10: Sedimentos finos / coluviales ──────────────────────────
      "Limo-arcillas y arenas con algun canto. Rellenos de Val": 0.10
      "Limo-arcillas y arenas con algún canto. Rellenos de Val": 0.10
      "CANTOS, LIMOS Y ARCILLAS. COLUVIAL": 0.10
      # ── Coste 0.15: Arcillas blandas / paleocanales aislados (defecto) ─────
      "Arcillas y paleocanales de arenisca. Unidad de Mequinenza-Ballobar": 0.15
      "Paleocanal individual": 0.15
      # ── Coste 0.22: Arenisca compacta / paleocanales exhumados ─────────────
      "Paleocanales de arenisca exhumados (ambas unidades)": 0.22
      "Paleocanales de arenisca exhumados. Unidad de Mequinenza-Ballobar": 0.22
      "Paleocanales de arenisca exhumados. Unidad de Torrente de Cinca-Alcolea de Cinca": 0.22
      "Paleocanales amalgamados": 0.22
      # ── Coste 0.28: Conglomerados / mezcla duro-blando ─────────────────────
      "Areniscas, conglomerados y arcillas": 0.28
      "Areniscas, conglomerados y arcillas. Unidad de Torrente de Cinca-Alcolea de Cinca": 0.28
      "Arcillas rojas, capas de calizas y areniscas": 0.28
      # ── Coste 0.34: Caliza presente = "Roca dura" oficial (A=13 → /38) ─────
      "Arcillas, paleocanales de arenisca y capas de calizas": 0.34
      "Arcillas rojas con niveles edafizados, capas de caliza...": 0.34
      "Arcillas rojas con niveles edafizados, capas de caliza y paleocanal. de arenisca. Un. de Fayón-Fraga": 0.34
      "Arcillas rojas con niveles edafizados, capas de caliza y paleocanal. de arenisca. Un. de Fay¢n-Fraga": 0.34  # corrupción GPKG: ó→¢
      # ── Coste 1.00: Yeso = "Terrenos inestables/expansivos" oficial (A=38) ─
      "Arcillas rojas con yeso nodular y areniscas": 1.00
      "Arcillas rojas con yeso nodular y areniscas. Unidad de Mequinenza-Ballobar": 1.00
      "ARCILLAS ROJAS CON NIVELES CENTIMETRICOS DE YESOS Y CALIZAS": 1.00
      "CANTOS, LIMOS YESIFEROS Y ARCILLAS. FONDOS DE VALLE PLANOS": 1.00
      "YESOS TABULARES Y NODULARES CON ARCILLAS GRISES": 1.00
      "YESOS TABULARES Y NODULARES CON ARCILLAS ROJAS Y GRISES": 1.00
      "YESOS TABULARES Y NODULARES CON MARGAS Y ARCILLAS": 1.00
      "Yesos masivos. U.BUJARALOZ-SARIÑENA": 1.00
      # ── Arcillas expansivas sin yeso (smectitas, montmorillonitas) ──────────
      "Arcillas expansivas": 1.00
      "Arcillas montmorilloniticas": 1.00
      "Margas expansivas": 1.00
      "Arcillas versicolores expansivas": 1.00


  # --------------------------------------------------------------------------
  # P3 — Expropiación (src/superficie/expropiacion.py)
  # Coste por tipo catastral (campo TIPO). Escala [0, 1] estandarizada
  # (A_oficial / 38) sobre la tipología urbanística oficial:
  #   · Urbano (U)        = "Área urbana alta densidad" (A=25.25)        → 0.66
  #   · Periurbano        = "Área urbana media densidad/industrial" (17.75) → 0.47
  #   · Dominio público   = sin expropiación                            → 0.03
  #   · Rústico (R)       = agrícola genérico (sin condicionante fuerte) → 0.10
  # fondo_cost: celdas sin parcela catastral (zona no catastrada).
  # Parcelas rústicas (R) con área < area_periurbano_m2 se tratan como periurbano.
  # --------------------------------------------------------------------------
  expropiacion:
    fondo_cost: 0.10          # celda sin parcela catastral (≈ rústico)
    default_cost: 0.30        # TIPO no listado en la tabla
    area_periurbano_m2: 500.0 # parcelas R menores que este umbral → periurbano
    cost_periurbano: 0.47     # "Área urbana media densidad / Zona industrial" (A=17.75)
    tipos:
      D: 0.03   # dominio público (vía, río, camino) — sin expropiación
      R: 0.10   # rústico (agrícola genérico)
      X: 0.30   # sin clasificar
      U: 0.66   # urbano = "Área urbana alta densidad" (A=25.25 → /38)

  # --------------------------------------------------------------------------
  # P4 — Zonas protegidas (src/superficie/zonas_protegidas.py)
  # Variable binaria: dentro de Red Natura 2000 = valor_protegida, fuera = valor_fondo.
  # valor_protegida estandarizado al factor oficial "RED NATURA 2000" (A=28.5):
  #   28.5 / 38 → 0.75. Así la capa comparte escala [0,1] con las demás.
  # El peso de la capa (perfiles[*].pesos.protegida) sigue modulando el énfasis
  # por perfil; el valor base ya refleja la severidad oficial del condicionante.
  # --------------------------------------------------------------------------
  zonas_protegidas:
    valor_protegida: 0.75  # "RED NATURA 2000" oficial (A=28.5 → /38); ZEPA/LIC/ZEC
    valor_fondo: 0.0       # fuera de zona protegida

  # --------------------------------------------------------------------------
  # P5 — Cruces viario + ríos (src/superficie/cruces_viario_rios.py)
  # Coste de cruce puntual (se paga UNA VEZ al atravesar la línea).
  # Fuente OSM: campo 'highway' (y 'railway' para ferrocarril).
  # Fuente hidrografía IGN: campos 'text' (nombre) y 'length' (metros).
  #
  # Ríos: estandarizados a los factores oficiales de curso hídrico (A_oficial/38):
  #   · Curso hídrico con agua permanente (A=13)    → 0.34  (río principal)
  #   · Curso hídrico sin agua permanente (A=9.75)  → 0.26  (rambla/sin nombre)
  #   (referencia: "Cruce por perforación horizontal" A=7 → 0.18, la técnica más
  #    barata; por eso un cruce de río resuelto bien es de coste moderado.)
  # Viario y ferrocarril NO tienen factor en la tabla oficial: se conservan
  # calibrados por dificultad constructiva/permisos, dentro del mismo [0, 1].
  # --------------------------------------------------------------------------
  cruces:
    fondo: 0.0              # celda sin ningún cruce
    ferrocarril: 0.9        # fila con columna 'railway' no nula (sin factor oficial)
    highway_default: 0.3    # tipo 'highway' no listado (~unclassified)
    highway:
      path: 0.2
      track: 0.2
      footway: 0.2
      service: 0.3
      unclassified: 0.3
      residential: 0.4
      tertiary: 0.5
      secondary: 0.6
      primary: 0.7
      trunk: 0.8
      motorway: 0.8
      construction: 0.4     # vía en obra (~residential)
    rio_sin_nombre: 0.26    # sin nombre → curso hídrico no permanente (A=9.75)
    rio_menor: 0.30         # con nombre y longitud ≤ umbral_rio_m
    rio_principal: 0.34     # con nombre y longitud > umbral_rio_m → permanente (A=13)
    umbral_rio_m: 2000.0    # umbral de longitud para clasificar ríos (metros)
