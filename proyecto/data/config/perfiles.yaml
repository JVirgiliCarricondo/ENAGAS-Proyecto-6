# Perfiles de prioridad — Grupo 6 (Reto 6, Enagás)
# Cada perfil es un vector de PESOS (adimensionales) sobre las capas de coste.
# Pesos distintos -> superficies de coste distintas -> rutas DIFERENCIADAS.
# Estos valores son orientativos: calibrarlos con el caso real (ver seguimiento.md).
#
# Capas de coste esperadas (ver src/superficie/, CAPAS_COSTE_P*.md):
#   pendiente      -> coste por inclinación (P1: script 01_pendiente_opcion_B.py)
#   uso_suelo      -> coste por tipo de suelo (P3: Catastro expropiación)
#   protegida      -> coste por estar en Red Natura 2000 (P4: MITECO/Copernicus)
#   geotecnia      -> coste por estabilidad del terreno (P2: IGME litología) [OPCIONAL]
#   longitud       -> coste base por distancia recorrida (multiplicador)

# ============================================================================
# PERFILES DE PRIORIDAD (4 alternativas diferenciadas)
# ============================================================================

perfiles:
  - id: corto
    nombre: "Más corto"
    descripcion: "Minimiza la longitud; tolera más pendiente e impacto ambiental."
    pesos:
      longitud:     1.5   # distancia muy importante
      pendiente:    0.2
      protegida:    0.2
      cruces:       0.3
      expropiacion: 0.2
      geotecnia:    0.1
      traversal:    0.1   # poca importancia: solo interesa la longitud
    nota: "Mejor velocidad de ejecución, pero pendientes/impacto mayores"

  - id: ambiental
    nombre: "Menor impacto ambiental"
    descripcion: "Evita zonas protegidas (Red Natura 2000) y cruces; aunque alargue el trazado."
    pesos:
      protegida:    1.5   # evitar zonas protegidas ante todo
      cruces:       0.8   # evitar cruces con infraestructuras
      expropiacion: 0.5
      pendiente:    0.3
      geotecnia:    0.3
      longitud:     0.3
      traversal:    0.3
    nota: "Prioriza viabilidad medioambiental"

  - id: pendiente
    nombre: "Menor pendiente y traversalidad"
    descripcion: "Busca terreno llano y sigue la dirección del gradiente (mayor estabilidad geotécnica)."
    pesos:
      pendiente:    1.5   # evitar pendiente fuerte
      traversal:    1.2   # seguir la dirección del gradiente
      geotecnia:    0.8   # terreno estable
      protegida:    0.4
      cruces:       0.3
      expropiacion: 0.3
      longitud:     0.3
    nota: "Reduce coste de obra por excavación y riesgo de movimientos de ladera"

  - id: equilibrio
    nombre: "Equilibrio (recomendado)"
    descripcion: "Balance entre criterios: pendiente, traversalidad, impacto, longitud y viabilidad."
    pesos:
      pendiente:    0.6
      traversal:    0.5
      protegida:    0.6
      cruces:       0.4
      expropiacion: 0.4
      geotecnia:    0.4
      longitud:     0.5
    nota: "Perfil recomendado como punto de partida para MVP 1-3"

# ============================================================================
# PARÁMETROS NORMATIVOS DE CAPAS (fijos, no calibrables)
# ============================================================================

# P1 — Pendiente (ver CAPAS_COSTE_P1_Pendiente.md)
parametros_pendiente:
  # Curva por tramos (normativa, FIJA)
  rango_0_5_grados:
    coste: 0.0
    descripcion: "Terreno llano — zanja normal, constructivamente trivial"

  rango_5_15_grados:
    coste_inicio: 0.0
    coste_fin: 0.6
    tipo: "rampa_lineal"
    descripcion: "Terreno inclinado — rampa de coste"

  rango_15_30_grados:
    coste_inicio: 0.6
    coste_fin: 1.0
    tipo: "rampa_lineal"
    descripcion: "Terreno muy inclinado — rampa saturation"

  barrera_dura_grados: 30
  coste_barrera: "infinito"
  descripcion_barrera: "Constructivamente prohibitivo — celda intransitable"

  # Método de cálculo
  algoritmo: "np.gradient"  # o "richdem" (Horn) para MVP 5-6
  resolucion_referencia_m: 30  # DEM Copernicus GLO-30

  # Reproducibilidad
  normalizacion: "absoluta (umbrales fijos)"
  reproductibilidad: "garantizada (misma pendiente = mismo coste siempre)"

# ============================================================================
# PARÁMETROS DE DIFERENCIACIÓN (corridor masking para alternativas)
# ============================================================================

diferenciacion:
  penalizacion_proximidad: 5.0   # factor de coste extra cerca de rutas ya generadas
  radio_corredor_m: 500          # ancho del corredor penalizado a cada lado, en metros
  max_solapamiento: 0.3          # solapamiento máximo admitido entre dos rutas (0-1)
  n_rutas: 3                     # nº de alternativas a generar (3-5)
  metodo: "corridor_masking"     # penalizar proximidad a rutas previas
