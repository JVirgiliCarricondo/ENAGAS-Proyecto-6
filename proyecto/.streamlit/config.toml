# Tema base — Enagás Engineering Core (design system de Stitch).
# Los colores finos y los componentes se afinan por CSS en src/app/streamlit_app.py.
[theme]
primaryColor = "#004e7e"            # primary (azul corporativo Enagás)
backgroundColor = "#f7fafc"         # surface / background
secondaryBackgroundColor = "#ffffff" # surface-container-lowest (tarjetas, inputs)
textColor = "#181c1e"               # on-surface
font = "sans-serif"

[client]
toolbarMode = "minimal"  # oculta el botón Deploy / menú (incluye "Iniciar sesión")

[server]
# Límite por fichero subido (MB). El default de Streamlit son 200 MB, que se
# queda corto para la cartografía catastral de municipios grandes (p. ej. la
# urbana de Zaragoza). El texto "X per file" del subidor se actualiza solo.
maxUploadSize = 1024
